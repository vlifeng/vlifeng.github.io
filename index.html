<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <title>MINIMAXUSDT</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070f;
      --fg: #f4f7ff;
      --muted: #8b97b8;
      --line: rgba(255,255,255,0.08);
      --green: #22c55e;
      --red: #ef4444;
      --accent: #67e8f9;
      --glow: rgba(103,232,249,0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "SF Pro Display", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      position: relative;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56,189,248,0.18), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 20%, rgba(168,85,247,0.12), transparent 50%),
        radial-gradient(ellipse 50% 35% at 10% 80%, rgba(34,197,94,0.08), transparent 45%),
        linear-gradient(180deg, #070b16 0%, #05070f 45%, #03050c 100%);
    }
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
      opacity: 0.45;
    }
    header, footer, .stage { position: relative; z-index: 1; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) 0.5rem max(1.5rem, env(safe-area-inset-left));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(103,232,249,0.15), 0 0 18px var(--glow);
      animation: pulse 1.8s ease-in-out infinite;
    }
    .dot.warn { background: #fbbf24; box-shadow: 0 0 0 4px rgba(251,191,36,0.15); }
    .dot.err { background: var(--red); box-shadow: 0 0 0 4px rgba(239,68,68,0.15); animation: none; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.7; }
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand p {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .stage {
      display: grid;
      place-items: center;
      padding: 1rem 1.5rem;
      text-align: center;
    }
    .panel {
      width: min(920px, 100%);
      padding: clamp(1.5rem, 4vw, 3rem);
      border-radius: 28px;
      border: 1px solid var(--line);
      background:
        linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02) 40%, rgba(255,255,255,0.01));
      box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
    }
    .label {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .pair {
      margin: 0.85rem 0 0;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 650;
      letter-spacing: 0.04em;
    }
    .price-wrap {
      margin: clamp(1.5rem, 4vh, 2.75rem) 0 1rem;
      position: relative;
    }
    #price {
      margin: 0;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-size: clamp(3.8rem, 16vw, 8.5rem);
      font-weight: 720;
      letter-spacing: -0.045em;
      line-height: 0.95;
      text-shadow: 0 0 60px rgba(103,232,249,0.18);
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }
    #price.up {
      color: var(--green);
      text-shadow: 0 0 70px rgba(34,197,94,0.28);
    }
    #price.down {
      color: var(--red);
      text-shadow: 0 0 70px rgba(239,68,68,0.28);
    }
    #price.flash {
      animation: flash 0.45s ease;
    }
    @keyframes flash {
      0% { transform: scale(1); }
      40% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    .delta {
      min-height: 1.5rem;
      font-variant-numeric: tabular-nums;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .delta.up { color: var(--green); }
    .delta.down { color: var(--red); }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: clamp(1.5rem, 4vh, 2.5rem);
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }
    .stat {
      text-align: left;
      padding: 0.35rem 0.25rem;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .stat strong {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem max(1.5rem, env(safe-area-inset-right)) max(1.25rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }
    footer code {
      color: #b6e7f5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
    }
    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; gap: 0.9rem; }
      .chip { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header>
    <div class="brand">
      <div id="liveDot" class="dot" title="live"></div>
      <div>
        <h1>Live Tape</h1>
        <p>Binance USDⓈ-M · 1s poll</p>
      </div>
    </div>
    <div class="chip"><span id="clock">--:--:--</span></div>
  </header>

  <section class="stage">
    <div class="panel">
      <p class="label">Mark Price</p>
      <h2 class="pair">MINIMAX / USDT</h2>
      <div class="price-wrap">
        <p id="price">—</p>
      </div>
      <div id="delta" class="delta">等待行情…</div>
      <div class="stats">
        <div class="stat">
          <span>Status</span>
          <strong id="status">连接中</strong>
        </div>
        <div class="stat">
          <span>Last Tick</span>
          <strong id="updated">—</strong>
        </div>
        <div class="stat">
          <span>Source</span>
          <strong id="source">—</strong>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div>免费公开接口 · 无需 API Key</div>
    <div><code id="endpoint">www.binance.com/fapi/v1/ticker/price</code></div>
  </footer>

  <script>
    const SYMBOL = "MINIMAXUSDT";
    const URLS = [
      `https://www.binance.com/fapi/v1/ticker/price?symbol=${SYMBOL}`,
      `https://fapi.binance.com/fapi/v1/ticker/price?symbol=${SYMBOL}`,
    ];

    const priceEl = document.getElementById("price");
    const deltaEl = document.getElementById("delta");
    const statusEl = document.getElementById("status");
    const updatedEl = document.getElementById("updated");
    const sourceEl = document.getElementById("source");
    const endpointEl = document.getElementById("endpoint");
    const liveDot = document.getElementById("liveDot");
    const clockEl = document.getElementById("clock");

    let lastPrice = null;
    let inFlight = false;

    function fmtTime(d = new Date()) {
      return d.toLocaleTimeString("zh-CN", { hour12: false });
    }

    function setClock() {
      clockEl.textContent = fmtTime();
    }
    setClock();
    setInterval(setClock, 250);

    function flash(el) {
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }

    async function fetchPrice() {
      if (inFlight) return;
      inFlight = true;
      let err;
      for (const url of URLS) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data == null || data.price == null) throw new Error("no price");

          const p = Number(data.price);
          const text = Number.isFinite(p) ? p.toLocaleString("en-US", {
            minimumFractionDigits: 5,
            maximumFractionDigits: 5,
          }) : String(data.price);

          priceEl.textContent = text;

          if (lastPrice != null && Number.isFinite(p)) {
            const diff = p - lastPrice;
            const pct = lastPrice ? (diff / lastPrice) * 100 : 0;
            const up = diff > 0;
            const down = diff < 0;
            priceEl.classList.toggle("up", up);
            priceEl.classList.toggle("down", down);
            deltaEl.classList.toggle("up", up);
            deltaEl.classList.toggle("down", down);
            if (diff === 0) {
              deltaEl.textContent = "持平 · 0.00000 (0.000%)";
              deltaEl.classList.remove("up", "down");
            } else {
              const sign = up ? "+" : "";
              deltaEl.textContent = `${sign}${diff.toFixed(5)}  (${sign}${pct.toFixed(3)}%)`;
              flash(priceEl);
            }
          } else {
            deltaEl.textContent = "首笔报价已就绪";
            deltaEl.classList.remove("up", "down");
          }

          lastPrice = p;
          statusEl.textContent = "Live";
          updatedEl.textContent = fmtTime();
          const host = new URL(url).host;
          sourceEl.textContent = host.replace(".binance.com", "");
          endpointEl.textContent = host + "/fapi/v1/ticker/price";
          liveDot.className = "dot";
          inFlight = false;
          return;
        } catch (e) {
          err = e;
        }
      }
      statusEl.textContent = "Error";
      deltaEl.textContent = String(err && err.message ? err.message : err);
      deltaEl.classList.remove("up", "down");
      liveDot.className = "dot err";
      inFlight = false;
    }

    fetchPrice();
    setInterval(fetchPrice, 1000);
  </script>
</body>
</html>
